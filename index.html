<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Карта курса</title><link rel="stylesheet" href="style.css"></head><body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>
<header class="glass"><div><h1 id="t"></h1><p id="s"></p></div><div class="prog"><div class="small" id="pt"></div><div class="bar"><i id="pb"></i></div></div></header>
<div class="wrap"><div class="map" id="map"><svg viewBox="0 0 1000 520" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7df9ff"/><stop offset="1" stop-color="#ff7ad9"/></linearGradient></defs><path id="base" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="10" stroke-linecap="round"/><path id="fill" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 12"/></svg></div></div>
<div id="panel" class="glass"></div>
<div id="test" class="glass"><span>🧪 Тест-режим</span><label>Текущая дата: <input type="date" id="sim"></label><button class="btn" id="simset">Применить</button><button class="btn" id="simreal">Реальная дата</button><button class="btn" id="reset">Сбросить прогресс</button><span class="small" id="info"></span></div>
<script src="config.js"></script><script src="app.js"></script></body></html>
